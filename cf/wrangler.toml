name = "tangocho"
main = "src/index.js"
compatibility_date = "2026-07-30"

# The built index.html is copied here by tools/build.mjs. Anything that isn't an API
# route falls through to this.
# run_worker_first: by default, static-asset requests (e.g. "/") are served straight from
# Cloudflare's edge cache without ever invoking fetch() below — which means withSecurityHeaders
# never runs and the page ships with no CSP/nosniff/frame-ancestors at all. This routes every
# request through the Worker first so the security headers actually land on the HTML response.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Sync payloads: small JSON, written rarely.
[[kv_namespaces]]
binding = "SYNC"
id = "ba175d82f8fb41e4b60d5dad6d2d4543"

# TTS audio cache. R2 would be the more natural fit for blobs, but enabling R2 needs a
# dashboard opt-in and a card on file, and KV is perfectly adequate here: clips are
# ~15KB against KV's 25MB per-value ceiling. The one real constraint is KV's ~1k
# writes/day on the free tier, which only matters when bulk pre-warming — normal study
# writes one clip per genuinely new word.
[[kv_namespaces]]
binding = "TTS"
id = "65cb9739891549aeb8ac804b87b8b799"

[observability]
enabled = true
head_sampling_rate = 1

# Secrets are NOT here — they go in via `wrangler secret put`, so they never land in git.
# Required: SESSION_SECRET, GOOGLE_TTS_API_KEY, ADMIN_WARM_TOKEN, GEMINI_API_KEY.
#   SESSION_SECRET: any 32+ random bytes, e.g.
#     node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))'
#   Rotating it signs every device out once; the app shows the sign-in button again and
#   re-pushes local progress after sign-in (see pullAndMergeCloud/pushCloudNow 401 handling).
#   Rotate immediately if the value ever appears in a commit, log, or screenshot.
#   GEMINI_API_KEY: from aistudio.google.com -> Get API key. Used only by cf/src/ai.js
#   (POST /api/ai), which is session-gated and owns its own prompts — the browser never sees
#   this key and never calls Google directly (see JpnFlashcards.jsx near AI_ENABLED).
#   It must be the long-lived key, which starts "AIzaSy". A value starting "AQ." is an
#   ephemeral Live-API token: it authenticates for about half an hour and then every AI
#   feature starts returning 502, which looks like a code bug and is not one.
#   Optional: GEMINI_MODEL overrides the model (default gemini-3.6-flash) without a deploy.
#   Google retires model names on their own schedule — 2.5-flash went "no longer available
#   to new users" mid-project and took every AI feature down with it. When that happens the
#   error names the replacement; set it here and no deploy is needed.
